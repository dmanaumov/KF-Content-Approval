<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>КФ — Восстановление пароля</title>
  <link rel="stylesheet" href="/app.css?v=3">
  <link rel="stylesheet" href="/projects.css?v=3">
</head>
<body>
<div class="page">
  <div id="app">
    <header class="head">
      <div class="head-top">
        <div class="kf"><img src="/kf-logo.png" alt="КФ"></div>
        <div class="client-brand">
          <strong>Восстановление пароля</strong>
        </div>
      </div>
    </header>

    <div class="fp-box">
      <p class="fp-intro">
        Введите почту из списка доверенных (её задаёт агентство в переменной
        <code>STAFF_RECOVERY_EMAILS</code>). Если она в списке — на неё придёт
        письмо с текущим логином и паролем от внутренней страницы проектов.
      </p>
      <label class="field-label" for="fpEmail">Ваша почта</label>
      <input id="fpEmail" class="field-input" type="email" placeholder="you@example.com" autocomplete="email">
      <button id="fpSubmit" class="btn approve fp-submit">Отправить напоминание</button>
      <div id="fpResult" class="fp-result" hidden></div>
    </div>
  </div>
</div>

<script>
  const emailInput = document.getElementById('fpEmail');
  const btn = document.getElementById('fpSubmit');
  const result = document.getElementById('fpResult');

  async function submit() {
    const email = emailInput.value.trim();
    result.hidden = true;
    if (!email) {
      result.textContent = 'Введите адрес почты.';
      result.hidden = false;
      return;
    }
    btn.disabled = true;
    const originalText = btn.textContent;
    btn.textContent = 'Отправляем…';
    try {
      const res = await fetch('/api/staff/forgot-password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email }),
      });
      const data = await res.json().catch(() => ({}));
      result.textContent = data.message || (res.ok ? 'Готово.' : 'Не удалось отправить запрос.');
      result.hidden = false;
    } catch (err) {
      result.textContent = 'Не удалось отправить запрос — попробуйте позже.';
      result.hidden = false;
    } finally {
      btn.disabled = false;
      btn.textContent = originalText;
    }
  }

  btn.addEventListener('click', submit);
  emailInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') submit(); });
</script>
</body>
</html>
