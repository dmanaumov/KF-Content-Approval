<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>КФ — Согласование задач</title>
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="stylesheet" href="/app.css?v=16">
</head>
<body>
<div class="page">
  <div id="app">
    <header class="head">
      <div class="head-top">
        <div class="kf"><img src="/kf-logo.png" alt="КФ"></div>
        <div class="head-right">
          <button id="calendarToggle" class="cal-toggle" type="button" title="Календарь публикаций" aria-label="Календарь публикаций">
            <span aria-hidden="true">🗓️</span>
          </button>
          <div class="client-brand">
            <div id="clientLogo" class="client-logo-demo">К</div>
            <strong id="clientName">Загрузка…</strong>
          </div>
        </div>
      </div>
      <div id="listHead">
        <div id="weeks" class="week-row"></div>
        <div class="progress-line">
          <div class="progress-track"><div id="progressFill" class="progress-fill"></div></div>
          <div id="progressText" class="progress-text"></div>
        </div>
      </div>
    </header>

    <div id="listView">
      <div id="attention" class="attention" hidden></div>
      <div class="filters">
        <button class="filter active" data-filter="waiting">Ожидают</button>
        <button class="filter" data-filter="changes">Правки</button>
        <button class="filter" data-filter="approved">Согласовано</button>
        <button class="filter" data-filter="published">Опубликовано</button>
        <button class="filter" data-filter="">Все</button>
      </div>
      <div id="loading" class="loading">Загружаем задачи из производственной системы КонтетФермы…</div>
      <main id="stack" class="stack"></main>
    </div>

    <div id="calendarView" class="calendar-view" hidden>
      <div class="cal-header">
        <button id="calBack" class="cal-back" type="button">← Назад</button>
        <div class="cal-nav">
          <button id="calPrev" class="cal-nav-btn" type="button" aria-label="Предыдущий месяц">‹</button>
          <span id="calTitle" class="cal-title"></span>
          <button id="calNext" class="cal-nav-btn" type="button" aria-label="Следующий месяц">›</button>
        </div>
      </div>
      <div class="cal-legend">
        <span><i class="cal-dot published"></i>Опубликовано</span>
        <span><i class="cal-dot approved"></i>Согласовано</span>
        <span><i class="cal-dot waiting"></i>Нужна оценка</span>
        <span><i class="cal-dot-fire" aria-hidden="true">🔥</i>Горит</span>
        <span><i class="cal-dot changes"></i>Правки</span>
      </div>
      <div class="cal-weekdays">
        <span>Пн</span><span>Вт</span><span>Ср</span><span>Чт</span><span>Пт</span><span>Сб</span><span>Вс</span>
      </div>
      <div id="calendarGrid" class="cal-grid"></div>
    </div>
  </div>
</div>

<div id="feedbackModal" class="modal-wrap">
  <div class="sheet">
    <h3>Что нужно поправить?</h3>
    <p id="feedbackTitle"></p>
    <textarea id="feedbackText" placeholder="Напишите правки одним сообщением…"></textarea>
    <div id="feedbackImagePreview" class="fb-image-preview" hidden></div>
    <div class="fb-attach-row">
      <button type="button" class="fb-attach-btn" data-action="pick-feedback-image" aria-label="Приложить фото" title="Приложить фото">
        <svg viewBox="0 0 24 24" aria-hidden="true" width="16" height="16"><path d="M21 12.5l-8.5 8.5a5 5 0 0 1-7-7l9-9a3.5 3.5 0 0 1 5 5l-9 9a2 2 0 0 1-3-3l8-8" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span>Приложить фото</span>
      </button>
      <input type="file" id="feedbackFileInput" accept="image/*" hidden>
    </div>
    <div class="sheet-actions">
      <button class="btn changes" data-action="close-feedback">Отмена</button>
      <button class="btn approve" data-action="send-feedback">Отправить правки</button>
    </div>
  </div>
</div>

<div id="mediaOrderModal" class="modal-wrap">
  <div class="sheet">
    <h3>Порядок фото/видео</h3>
    <p>Стрелками расставьте материалы в нужном порядке.</p>
    <div id="moList" class="mo-list"></div>
    <div class="sheet-actions">
      <button class="btn changes" data-action="close-media-order">Отмена</button>
      <button class="btn approve" data-action="save-media-order">Сохранить порядок</button>
    </div>
  </div>
</div>

<div id="lightbox" class="lightbox" hidden>
  <div class="lightbox-backdrop"></div>
  <button type="button" class="lightbox-close" aria-label="Закрыть">✕</button>
  <img id="lightboxImg" src="" alt="">
</div>

<div id="toast" class="toast"></div>

<script src="/app.js?v=13"></script>
<script src="/welcome.js?v=1" defer data-audience="client"></script>
</body>
</html>
