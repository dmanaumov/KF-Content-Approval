<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>КФ — Приглашение</title>
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<!-- Та же тройка стилей, что у /team и /tool — реальные field-label/
     field-input/fp-box/btn вместо придуманных .inv-* классов (см. правку
     2026-10-13 после жалобы "почему другой интерфейс"). -->
<link rel="stylesheet" href="/app.css?v=22">
<link rel="stylesheet" href="/projects.css?v=15">
<link rel="stylesheet" href="/team.css?v=34">
<style>
  .inv-wrap{max-width:420px;margin:0 auto}
  .inv-mascot{width:48px;height:48px;border-radius:14px;background:#FFE6E4;display:flex;align-items:center;justify-content:center;flex:none;overflow:hidden}
  .inv-mascot img{width:88%;height:88%;object-fit:contain}
  .inv-mode{display:inline-block;margin-bottom:10px}
  .inv-hint{font-size:11px;color:var(--muted);margin-top:4px;line-height:1.4}
  .inv-state{text-align:center;padding:60px 10px;color:var(--muted);font-size:14px}
</style>
</head>
<body>
<div class="page inv-wrap">
  <header class="head">
    <div class="head-top">
      <div class="kf"><img src="/kf-logo.png" alt="КФ"></div>
      <div class="client-brand"><strong>КонтентФерма</strong></div>
    </div>
  </header>

  <div id="invState" class="inv-state">Загрузка…</div>

  <div id="invBox" class="fp-box" hidden>
    <span class="inv-mode status" id="invModeLabel">Инструмент</span>
    <p class="fp-intro" id="invIntro" style="font-size:14px;color:var(--ink);font-weight:800;margin-bottom:4px"></p>
    <p class="fp-intro" id="invSub"></p>

    <label class="field-label" for="invCode">Код из приглашения</label>
    <input id="invCode" class="field-input" inputmode="numeric" maxlength="6" placeholder="6 цифр" autocomplete="one-time-code">

    <label class="field-label" for="invProjectName">Название проекта</label>
    <input id="invProjectName" class="field-input" type="text" placeholder="например, «Мой бренд»">

    <label class="field-label" for="invLogin">Email или телефон</label>
    <input id="invLogin" class="field-input" type="text" autocomplete="username" placeholder="для входа в кабинет">

    <label class="field-label" for="invPassword">Пароль</label>
    <input id="invPassword" class="field-input" type="password" autocomplete="new-password" placeholder="не короче 8 символов">
    <div class="inv-hint">Этот пароль придумываете вы — он нужен для последующих входов, код из приглашения действует только один раз.</div>

    <label class="field-label" for="invName">Как вас зовут (необязательно)</label>
    <input id="invName" class="field-input" type="text" placeholder="имя">

    <button id="invSubmit" class="btn approve fp-submit">Создать проект</button>
    <div id="invError" class="error-box" style="margin-top:14px" hidden></div>
  </div>
</div>
<script>
(function () {
  var token = location.pathname.split('/').filter(Boolean).pop();
  var stateEl = document.getElementById('invState');
  var boxEl = document.getElementById('invBox');
  var errEl = document.getElementById('invError');
  var modeLabelEl = document.getElementById('invModeLabel');
  var introEl = document.getElementById('invIntro');
  var subEl = document.getElementById('invSub');
  var submitBtn = document.getElementById('invSubmit');

  function showError(msg) {
    errEl.textContent = msg;
    errEl.hidden = false;
  }

  fetch('/api/invite/' + encodeURIComponent(token))
    .then(function (r) { return r.json().then(function (data) { return { ok: r.ok, data: data }; }); })
    .then(function (res) {
      if (!res.ok) {
        var msg = res.data.error === 'invite_used'
          ? 'Эта ссылка уже использована — попросите новое приглашение.'
          : 'Ссылка-приглашение не найдена или устарела.';
        stateEl.textContent = msg;
        return;
      }
      stateEl.hidden = true;
      boxEl.hidden = false;
      if (res.data.mode === 'ai') {
        modeLabelEl.textContent = 'ИИ СММ-ассистент';
        modeLabelEl.classList.add('ai');
        introEl.textContent = 'Создадим ваш проект';
        subEl.textContent = 'Введите код из приглашения и придумайте пароль для входа — проект создастся сразу, донастройка анкеты будет доступна в кабинете.';
      } else {
        modeLabelEl.textContent = 'СММ-инструмент';
        modeLabelEl.classList.add('waiting');
        introEl.textContent = 'Создадим ваш проект';
        subEl.textContent = 'Введите код из приглашения и придумайте пароль для входа — после этого сразу попадёте в свой кабинет.';
      }
    })
    .catch(function () { stateEl.textContent = 'Не получилось проверить ссылку — проверьте подключение и обновите страницу.'; });

  submitBtn.addEventListener('click', function () {
    errEl.hidden = true;
    var code = document.getElementById('invCode').value.trim();
    var login = document.getElementById('invLogin').value.trim();
    var password = document.getElementById('invPassword').value;
    var displayName = document.getElementById('invName').value.trim();
    var projectName = document.getElementById('invProjectName').value.trim();
    if (!code || !login || !password) {
      showError('Заполните код, email/телефон и пароль.');
      return;
    }
    submitBtn.disabled = true;
    submitBtn.textContent = 'Создаём…';
    fetch('/api/invite/' + encodeURIComponent(token) + '/redeem', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ code: code, login: login, password: password, displayName: displayName, projectName: projectName }),
    })
      .then(function (r) { return r.json().then(function (data) { return { ok: r.ok, data: data }; }); })
      .then(function (res) {
        if (!res.ok) {
          showError((res.data && (res.data.message || res.data.error)) || 'Не получилось создать проект.');
          submitBtn.disabled = false;
          submitBtn.textContent = 'Создать проект';
          return;
        }
        location.href = '/tool';
      })
      .catch(function () {
        showError('Ошибка сети — попробуйте ещё раз.');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Создать проект';
      });
  });
})();
</script>
</body>
</html>
