<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>КФ — Кабинет команды</title>
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="stylesheet" href="/app.css?v=13">
  <link rel="stylesheet" href="/projects.css?v=14">
  <link rel="stylesheet" href="/team.css?v=17">
</head>
<body>
<div class="page">
  <div id="loginApp">
    <header class="head">
      <div class="head-top">
        <div class="kf"><img src="/kf-logo.png" alt="КФ"></div>
        <div class="client-brand">
          <strong>Кабинет команды</strong>
        </div>
      </div>
    </header>

    <div class="fp-box team-login-box">
      <p class="fp-intro">Войдите под своим логином и паролем от Mattermost — увидите только свои задачи.</p>
      <label class="field-label" for="loginLogin">Логин или email</label>
      <input id="loginLogin" class="field-input" type="text" autocomplete="username" placeholder="ваш логин в Mattermost">
      <label class="field-label" for="loginPassword">Пароль</label>
      <input id="loginPassword" class="field-input" type="password" autocomplete="current-password">
      <button id="loginSubmit" class="btn approve fp-submit">Войти</button>
      <div id="loginError" class="error-box team-login-error" hidden></div>
    </div>
  </div>

  <div id="teamApp" hidden>
    <header class="head">
      <div class="head-top">
        <div class="kf"><img src="/kf-logo.png" alt="КФ"></div>
        <div class="head-right">
          <div class="client-brand">
            <strong id="teamUserName">…</strong>
          </div>
          <a id="adminLink" class="head-icon-link" href="/projects" title="Админка" aria-label="Админка" hidden>
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="8" height="8" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.8"/><rect x="13" y="3" width="8" height="8" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.8"/><rect x="3" y="13" width="8" height="8" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.8"/><rect x="13" y="13" width="8" height="8" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>
          </a>
          <a id="statLink" class="head-icon-link" href="/stat" title="Статистика доступа" aria-label="Статистика доступа" hidden>
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="12" width="4" height="8" rx="1" fill="none" stroke="currentColor" stroke-width="1.8"/><rect x="10" y="7" width="4" height="13" rx="1" fill="none" stroke="currentColor" stroke-width="1.8"/><rect x="16" y="3" width="4" height="17" rx="1" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>
          </a>
          <button id="logoutBtn" class="cal-toggle" type="button" title="Выйти" aria-label="Выйти">
            <span aria-hidden="true">⎋</span>
          </button>
        </div>
      </div>
    </header>

    <div id="teamFilters" class="team-filters" hidden></div>
    <div id="teamLoading" class="loading">Загружаем ваши задачи…</div>
    <div id="teamEmpty" class="team-empty" hidden>На вас пока нет ни одной задачи.</div>
    <main id="teamList" class="team-list"></main>

    <button id="fabCreate" class="fab-create" type="button" aria-label="Запланировать публикацию">
      <span class="fab-create-icon" aria-hidden="true">+</span>
      <span class="fab-create-label">Запланировать публикацию</span>
    </button>
  </div>
</div>

<div id="createModal" class="tm-modal" hidden>
  <div class="tm-backdrop"></div>
  <div class="tm-card create-card">
    <button id="createClose" class="tm-close" type="button" aria-label="Закрыть">✕</button>
    <div class="create-body">
      <div class="create-head">
        <div class="create-head-icon" aria-hidden="true">🗓️</div>
        <h2 class="create-title">Запланировать публикацию</h2>
        <p class="create-subtitle">Новая карточка появится у вас в списке задач сразу после сохранения.</p>
      </div>
      <form id="createForm" class="create-form" novalidate>
        <label class="field-label" for="cfTitle">Заголовок поста</label>
        <input id="cfTitle" class="field-input" type="text" placeholder="Например: анонс акции" required maxlength="200">

        <div class="create-row">
          <div>
            <label class="field-label" for="cfProject">Проект</label>
            <select id="cfProject" class="field-input" required>
              <option value="" disabled selected>Загружаем…</option>
            </select>
          </div>
          <div>
            <label class="field-label" for="cfNetwork">Соцсеть</label>
            <select id="cfNetwork" class="field-input">
              <option value="">Не выбрана</option>
            </select>
          </div>
        </div>

        <div class="create-row">
          <div>
            <label class="field-label" for="cfDate">Дата публикации</label>
            <input id="cfDate" class="field-input" type="date" required>
          </div>
          <div>
            <label class="field-label" for="cfStatus">Статус</label>
            <select id="cfStatus" class="field-input">
              <option value="" disabled selected>Загружаем…</option>
            </select>
          </div>
        </div>

        <label class="field-label" for="cfText">Текст поста <span class="create-optional">(необязательно, можно дописать позже)</span></label>
        <textarea id="cfText" class="tm-textarea" placeholder="Можно оставить пустым и дописать позже прямо в карточке"></textarea>

        <div id="createError" class="error-box" hidden></div>

        <button id="cfSubmit" type="submit" class="fab-create-submit">
          <span aria-hidden="true">＋</span> Запланировать публикацию
        </button>
      </form>
    </div>
  </div>
</div>

<div id="taskModal" class="tm-modal" hidden>
  <div class="tm-backdrop"></div>
  <div class="tm-card">
    <button id="tmClose" class="tm-close" type="button" aria-label="Закрыть">✕</button>
    <div id="tmHead" class="tm-head"></div>
    <div id="tmTabbar" class="tm-tabbar"></div>
    <div id="tmBody" class="tm-body"></div>
  </div>
</div>

<div id="lightbox" class="lightbox" hidden>
  <div class="lightbox-backdrop"></div>
  <button type="button" class="lightbox-close" aria-label="Закрыть">✕</button>
  <img id="lightboxImg" src="" alt="">
</div>

<div id="toast" class="toast"></div>

<script src="/team.js?v=14"></script>
<script src="/welcome.js?v=1" defer data-audience="staff"></script>
</body>
</html>
