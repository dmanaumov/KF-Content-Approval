<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>КФ — Кабинет команды</title>
  <link rel="stylesheet" href="/app.css?v=5">
  <link rel="stylesheet" href="/projects.css?v=5">
  <link rel="stylesheet" href="/team.css?v=9">
</head>
<body>
<div class="page">
  <div id="loginApp">
    <header class="head">
      <div class="head-top">
        <div class="kf"><img src="/kf-logo.png" alt="КФ"></div>
        <div class="client-brand">
          <strong>Кабинет команды</strong>
        </div>
      </div>
    </header>

    <div class="fp-box team-login-box">
      <p class="fp-intro">Войдите под своим логином и паролем от Mattermost — увидите только свои задачи.</p>
      <label class="field-label" for="loginLogin">Логин или email</label>
      <input id="loginLogin" class="field-input" type="text" autocomplete="username" placeholder="ваш логин в Mattermost">
      <label class="field-label" for="loginPassword">Пароль</label>
      <input id="loginPassword" class="field-input" type="password" autocomplete="current-password">
      <button id="loginSubmit" class="btn approve fp-submit">Войти</button>
      <div id="loginError" class="error-box team-login-error" hidden></div>
    </div>
  </div>

  <div id="teamApp" hidden>
    <header class="head">
      <div class="head-top">
        <div class="kf"><img src="/kf-logo.png" alt="КФ"></div>
        <div class="head-right">
          <div class="client-brand">
            <strong id="teamUserName">…</strong>
          </div>
          <a id="statLink" class="head-link" href="/stat" title="Статистика доступа" aria-label="Статистика доступа" hidden>Статистика</a>
          <button id="logoutBtn" class="cal-toggle" type="button" title="Выйти" aria-label="Выйти">
            <span aria-hidden="true">⎋</span>
          </button>
        </div>
      </div>
    </header>

    <div id="teamFilters" class="team-filters" hidden></div>
    <div id="teamLoading" class="loading">Загружаем ваши задачи…</div>
    <div id="teamEmpty" class="team-empty" hidden>На вас пока нет ни одной задачи.</div>
    <main id="teamList" class="team-list"></main>
  </div>
</div>

<div id="taskModal" class="tm-modal" hidden>
  <div class="tm-backdrop"></div>
  <div class="tm-card">
    <button id="tmClose" class="tm-close" type="button" aria-label="Закрыть">✕</button>
    <div id="tmHead" class="tm-head"></div>
    <div id="tmTabbar" class="tm-tabbar"></div>
    <div id="tmBody" class="tm-body"></div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script src="/team.js?v=9"></script>
</body>
</html>
