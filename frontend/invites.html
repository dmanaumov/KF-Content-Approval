<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>КФ — Приглашения</title>
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="stylesheet" href="/app.css?v=22">
<link rel="stylesheet" href="/projects.css?v=24">
<style>
  /* Шапка .staff-head/.head-icon-link ниже — те же классы, что и у основной
     админки (projects.html, см. его .staff-head/.staff-links) — по
     прямому запросу пользователя 2026-10-13: "окно управления клиентами
     выглядит оторванным, давай его вписывать в общую админку". Контент
     страницы (выпуск ссылки, таблица приглашений) остаётся своим, просто
     теперь под тем же баннером и с переходом назад в админку. */
  .iv-wrap{max-width:640px;margin:0 auto;padding:22px 16px 60px}
  .iv-intro{font-size:13px;color:var(--muted);margin:0 0 16px}
  .iv-row{display:flex;gap:10px;margin-bottom:18px}
  .iv-row select{border:1px solid var(--line);border-radius:12px;padding:12px 13px;font-size:14px;background:var(--bg);color:var(--ink)}
  .iv-result{background:#E1F3E5;border-radius:14px;padding:16px;margin-bottom:20px;font-size:14px}
  .iv-result code{display:inline-block;background:#fff;border:1px solid var(--line);border-radius:8px;padding:4px 8px;font-size:13px;word-break:break-all}
  .iv-result .iv-code{font-size:22px;font-weight:800;letter-spacing:.06em}
  .iv-result p{margin:6px 0}
  .iv-copy{font-size:12px;border:0;background:var(--accent);color:#fff;border-radius:8px;padding:5px 9px;margin-left:6px;cursor:pointer}
  table.iv-table{width:100%;border-collapse:collapse;font-size:13px}
  table.iv-table th,table.iv-table td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line)}
  .iv-badge{font-size:11px;font-weight:800;padding:3px 8px;border-radius:999px}
  .iv-badge.pending{background:#FFF3C9;color:#755600}
  .iv-badge.used{background:#E1F3E5;color:#216A39}
  @media (prefers-color-scheme: dark){
    .iv-result{background:#213626}
    .iv-result code{background:#12181A}
  }
</style>
</head>
<body>
<div class="page">
  <header class="staff-head">
    <div class="staff-head-main">
      <div class="staff-title-row">
        <div class="kf"><img src="/kf-logo.png" alt="КФ"></div>
        <h1 class="staff-title">Приглашения в самостоятельный <span class="staff-title-brand">кабинет</span></h1>
      </div>
      <div class="staff-sub-row">
        <p class="staff-sub">Ссылка + код — доступ к созданию SaaS-проекта без участия команды</p>
        <div class="staff-head-pill">только admin/CEO</div>
      </div>
      <div class="staff-links">
        <a id="adminBackLink" class="head-icon-link" href="#" title="Назад в админку" aria-label="Назад в админку">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="8" height="8" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.8"/><rect x="13" y="3" width="8" height="8" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.8"/><rect x="3" y="13" width="8" height="8" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.8"/><rect x="13" y="13" width="8" height="8" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>
        </a>
        <a class="head-icon-link" href="/team" title="Кабинет команды" aria-label="Кабинет команды">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="8.5" cy="8.5" r="3.2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M4 20c0-3 1.9-4.7 4.5-4.7s4.5 1.7 4.5 4.7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M15 5.8a3.2 3.2 0 110 5.4M15.5 15.6c2.2.6 3.5 2.1 3.5 4.4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        </a>
        <a class="head-icon-link" href="/stat" title="Статистика доступа" aria-label="Статистика доступа">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="12" width="4" height="8" rx="1" fill="none" stroke="currentColor" stroke-width="1.8"/><rect x="10" y="7" width="4" height="13" rx="1" fill="none" stroke="currentColor" stroke-width="1.8"/><rect x="16" y="3" width="4" height="17" rx="1" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>
        </a>
      </div>
    </div>
  </header>

  <div class="iv-wrap">
  <p class="iv-intro">Ссылку отправьте получателю как угодно, а код — ОТДЕЛЬНЫМ сообщением (например, в WhatsApp), не в одном тексте со ссылкой.</p>

  <div class="iv-row">
    <select id="modeSelect">
      <option value="tool">Просто инструмент</option>
      <option value="ai">С ИИ (пока не обслуживается)</option>
    </select>
    <button id="createBtn" class="btn approve">Создать ссылку</button>
  </div>

  <div id="result" hidden class="iv-result"></div>

  <table class="iv-table">
    <thead><tr><th>Создано</th><th>Режим</th><th>Статус</th><th></th></tr></thead>
    <tbody id="inviteRows"></tbody>
  </table>
  </div>
</div>
<script>
(function () {
  // Путь назад в админку — не хардкодим "/projects": эта страница всегда
  // живёт по адресу {staffProjectsPath}/invites (см. index.js), так что
  // просто отрезаем "/invites" от своего же пути — работает и если
  // STAFF_PROJECTS_PATH сконфигурирован иначе.
  document.getElementById('adminBackLink').href = location.pathname.replace(/\/invites\/?$/, '') || '/';

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function fmtDate(iso) {
    try { return new Date(iso).toLocaleString('ru-RU', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' }); }
    catch (e) { return iso; }
  }

  function loadList() {
    fetch('/api/tool-invites').then(function (r) { return r.json(); }).then(function (data) {
      var rows = (data.invites || []).map(function (inv) {
        var statusHtml = inv.used_at
          ? '<span class="iv-badge used">Использовано' + (inv.used_by_login ? ' — ' + esc(inv.used_by_login) : '') + '</span>'
          : '<span class="iv-badge pending">Ожидает</span>';
        // "Сбросить пароль" — только у уже погашенных приглашений (есть
        // аккаунт, которому есть что сбрасывать), по прямому запросу
        // пользователя 2026-10-13.
        var actionHtml = inv.used_by_account_id
          ? '<button class="iv-copy" style="background:#A12E2E" data-reset="' + esc(inv.used_by_account_id) + '" data-login="' + esc(inv.used_by_login || '') + '">Сбросить пароль</button>'
          : '';
        return '<tr><td>' + fmtDate(inv.created_at) + '</td><td>' + (inv.mode === 'ai' ? 'С ИИ' : 'Инструмент') + '</td><td>' + statusHtml + '</td><td>' + actionHtml + '</td></tr>';
      });
      document.getElementById('inviteRows').innerHTML = rows.join('') || '<tr><td colspan="4" style="color:var(--muted)">Пока нет приглашений</td></tr>';
    });
  }

  function copy(text, btn) {
    navigator.clipboard.writeText(text).then(function () {
      var old = btn.textContent;
      btn.textContent = 'Скопировано';
      setTimeout(function () { btn.textContent = old; }, 1400);
    });
  }

  document.getElementById('createBtn').addEventListener('click', function () {
    var mode = document.getElementById('modeSelect').value;
    fetch('/api/tool-invites', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ mode: mode }),
    })
      .then(function (r) { return r.json().then(function (data) { return { ok: r.ok, data: data }; }); })
      .then(function (res) {
        var resultEl = document.getElementById('result');
        if (!res.ok) {
          resultEl.hidden = false;
          resultEl.style.background = '#FBE0E0';
          resultEl.textContent = (res.data && res.data.message) || 'Не удалось создать приглашение.';
          return;
        }
        resultEl.hidden = false;
        resultEl.style.background = '';
        resultEl.innerHTML =
          '<p><strong>Ссылка</strong> (отправьте как угодно):<br><code id="ivUrl">' + esc(res.data.inviteUrl) + '</code><button class="iv-copy" id="copyUrl">Копировать</button></p>' +
          '<p><strong>Код</strong> (отправьте ОТДЕЛЬНЫМ сообщением, другим каналом):<br><span class="iv-code" id="ivCode">' + esc(res.data.code) + '</span><button class="iv-copy" id="copyCode">Копировать</button></p>' +
          '<p style="color:var(--muted);font-size:12px">Код показывается только сейчас — если потерять, нужно будет создать новое приглашение.</p>';
        document.getElementById('copyUrl').addEventListener('click', function () { copy(res.data.inviteUrl, this); });
        document.getElementById('copyCode').addEventListener('click', function () { copy(res.data.code, this); });
        loadList();
      });
  });

  document.getElementById('inviteRows').addEventListener('click', function (e) {
    var accountId = e.target.getAttribute('data-reset');
    if (!accountId) return;
    var login = e.target.getAttribute('data-login');
    if (!confirm('Сбросить пароль для ' + (login || 'этого аккаунта') + '? Старый пароль перестанет работать, пользователя разлогинит.')) return;
    e.target.disabled = true;
    fetch('/api/tool-accounts/' + encodeURIComponent(accountId) + '/reset-password', { method: 'POST' })
      .then(function (r) { return r.json().then(function (data) { return { ok: r.ok, data: data }; }); })
      .then(function (res) {
        e.target.disabled = false;
        var resultEl = document.getElementById('result');
        if (!res.ok) {
          resultEl.hidden = false;
          resultEl.style.background = '#FBE0E0';
          resultEl.textContent = (res.data && res.data.message) || 'Не удалось сбросить пароль.';
          resultEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
          return;
        }
        resultEl.hidden = false;
        resultEl.style.background = '';
        resultEl.innerHTML =
          '<p><strong>Новый пароль</strong> для <code>' + esc(res.data.login) + '</code> (передайте пользователю сами, ОТДЕЛЬНЫМ каналом):<br><span class="iv-code" id="ivNewPassword">' + esc(res.data.password) + '</span><button class="iv-copy" id="copyNewPassword">Копировать</button></p>' +
          '<p style="color:var(--muted);font-size:12px">Пароль показывается только сейчас — если потерять, нужно будет сбросить ещё раз. Все предыдущие сессии этого аккаунта завершены.</p>';
        document.getElementById('copyNewPassword').addEventListener('click', function () { copy(res.data.password, this); });
        resultEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
      })
      .catch(function () {
        e.target.disabled = false;
        alert('Ошибка сети — попробуйте ещё раз.');
      });
  });

  loadList();
})();
</script>
</body>
</html>
