services:
  # Stores project_settings (rotatable client link, logo URL, per-network
  # publishing credentials) and publication_log (written by the n8n
  # automation — see docs/N8N_AUTOMATION.md). The one deliberate database in
  # this otherwise-stateless app — see backend/src/db.js for why.
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kfapproval}
      POSTGRES_USER: ${POSTGRES_USER:-kfapproval}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - kf-db-data:/var/lib/postgresql/data
    expose:
      - "5432"
    # Uncomment ONLY if n8n runs OUTSIDE this Dokploy project/Docker network
    # and needs to reach Postgres directly. Leave commented (internal-only)
    # if n8n runs alongside this app — Docker's internal DNS already lets
    # the "app" service (and n8n, if it's on this same network) reach this
    # one at host "db", no public port needed. If you do uncomment this,
    # n8n should connect using the dedicated "n8n" role (N8N_DB_USER/
    # N8N_DB_PASSWORD in .env.example — created automatically by the app,
    # read-only on project_settings), NOT POSTGRES_USER above (that one is a
    # full superuser on this database) — this becomes a public port either
    # way, so keep whichever password you hand out strong.
    # ports:
    #   - "5432:5432"

  app:
    build:
      context: .
      dockerfile: backend/Dockerfile
    expose:
      - "${PORT:-3000}"
    env_file:
      - .env
    environment:
      # Built from the POSTGRES_* vars above so there's one password to set
      # (see .env.example). "db" resolves via Docker's internal DNS to the
      # service above.
      DATABASE_URL: postgres://${POSTGRES_USER:-kfapproval}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-kfapproval}
    restart: unless-stopped
    depends_on:
      - db
    volumes:
      # LEGACY — only still needed so the one-time migration in
      # backend/src/projectSettings.js (importLegacyFileTokens) can read the
      # link token that was already issued/tested before this app moved to
      # Postgres. Safe to remove once you've confirmed the staff page still
      # shows the same client link after the first deploy of this version.
      - project-links-data:/app/data

volumes:
  project-links-data:
  kf-db-data:
