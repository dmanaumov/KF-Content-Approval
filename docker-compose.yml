services:
  # Stores project_settings (rotatable client link, logo URL, per-network
  # publishing credentials) and publication_log (written by the n8n
  # automation — see docs/N8N_AUTOMATION.md). The one deliberate database in
  # this otherwise-stateless app — see backend/src/db.js for why.
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kfapproval}
      POSTGRES_USER: ${POSTGRES_USER:-kfapproval}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - kf-db-data:/var/lib/postgresql/data
    expose:
      - "5432"
    # Lets the "app" service below wait for Postgres to actually be ready
    # to accept connections, not just for this container to have started
    # (plain `depends_on: [db]` only orders container start — Postgres can
    # still be mid-initdb for several seconds after that). Without this, the
    # very first boot after adding this service could hit a race where
    # `app` queries Postgres before it's ready, fails once, and — since the
    # app used to only try schema setup once — never creates its tables for
    # the rest of that container's life. app.js also now retries on its own
    # as a second line of defense (see waitForDb() in backend/src/index.js).
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kfapproval} -d ${POSTGRES_DB:-kfapproval}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    # Uncomment ONLY if n8n runs OUTSIDE this Dokploy project/Docker network
    # and needs to reach Postgres directly. Leave commented (internal-only)
    # if n8n runs alongside this app — Docker's internal DNS already lets
    # the "app" service (and n8n, if it's on this same network) reach this
    # one at host "db", no public port needed. If you do uncomment this,
    # n8n should connect using the dedicated "n8n" role (N8N_DB_USER/
    # N8N_DB_PASSWORD in .env.example — created automatically by the app,
    # read-only on project_settings), NOT POSTGRES_USER above (that one is a
    # full superuser on this database) — this becomes a public port either
    # way, so keep whichever password you hand out strong.
    # ports:
    #   - "5432:5432"
    networks:
      default:
      # ПЕРЕИМЕНОВАНО 2026-10-15 (критичный прод-баг) — алиас 'db' в общей
      # dokploy-network конфликтовал с ОДНОИМЁННЫМИ 'db'-сервисами других
      # проектов на этом же Dokploy-хосте (my-kf, perf-kf, smm-saas и др. —
      # все явно склонированы с одного шаблона). Docker DNS на общей сети
      # отдавал то этот контейнер, то чужой — приложение иногда коннектилось
      # к ЧУЖОЙ базе другого проекта и тихо получало 0 строк вместо ошибки
      # (совпадали POSTGRES_USER/POSTGRES_DB по умолчанию). Рестарт/редеплой
      # APP не лечил — проблема на уровне DNS сети, не внутри процесса.
      # Уникальный алиас ниже полностью убирает коллизию. Если n8n (см.
      # docs/N8N_AUTOMATION.md) подключается через 'db' на dokploy-network —
      # обнови там Host на 'smm-tool-yg4ifn-pg'.
      dokploy-network:
        aliases:
          - smm-tool-yg4ifn-pg

  app:
    build:
      context: .
      dockerfile: backend/Dockerfile
    expose:
      - "${PORT:-3000}"
    env_file:
      - .env
    environment:
      # Если DATABASE_URL задан в .env (или в Dokploy → Environment) —
      # используется он целиком, как есть. Это даёт возможность в будущем
      # перенести Postgres в отдельную сущность/хост без правок этого
      # файла — достаточно будет поменять значение переменной на сервере.
      # Если DATABASE_URL НЕ задан — собираем строку сами из POSTGRES_*
      # выше и адреса 'smm-tool-yg4ifn-pg' (см. комментарий у сервиса db
      # выше: это НЕ 'db' специально — общий алиас 'db' на dokploy-network
      # конфликтовал с одноимёнными сервисами других проектов на этом же
      # Dokploy-хосте и был источником критичного прод-бага 2026-10-15).
      DATABASE_URL: ${DATABASE_URL:-postgres://${POSTGRES_USER:-kfapproval}:${POSTGRES_PASSWORD}@smm-tool-yg4ifn-pg:5432/${POSTGRES_DB:-kfapproval}}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # LEGACY — only still needed so the one-time migration in
      # backend/src/projectSettings.js (importLegacyFileTokens) can read the
      # link token that was already issued/tested before this app moved to
      # Postgres. Safe to remove once you've confirmed the staff page still
      # shows the same client link after the first deploy of this version.
      - project-links-data:/app/data
      # Local cache of disk.kontentferma media (backend/src/diskCache.js) —
      # persistent so a redeploy doesn't send every file back through
      # Nextcloud again. Size cap: DISK_CACHE_MAX_MB (default 5 GB).
      - disk-cache:/app/cache
    networks:
      default:
      dokploy-network:

volumes:
  project-links-data:
  kf-db-data:
  disk-cache:

networks:
  default:
  dokploy-network:
    external: true
